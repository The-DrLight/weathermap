services:
  - type: web
    name: lagos-weather-backend
    env: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: LAT
        value: "6.5244"
      - key: LON
        value: "3.3792"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: MODEL_PATH
        value: models/rain_model.joblib
